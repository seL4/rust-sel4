[package]
name = "sel4-sys"
version = "0.1.0"
authors = ["Nick Spinale <nick.spinale@coliasgroup.com>"]
build = "build/main.rs"
edition = "2024"
license = "BSD-2-Clause"
links = "sel4"

[dependencies]
log = "0.4.28"
sel4-bitfield-ops = { path = "../bitfield-ops" }
sel4-config = { path = "../config" }

[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }
glob = "0.3.3"
nom = { version = "7.1.3", default-features = false, features = ["alloc"] }
proc-macro2 = { version = "1.0.103", default-features = false }
quote = { version = "1.0.41", default-features = false }
roxmltree = { version = "0.21.2", default-features = false }
sel4-build-env = { path = "../build-env" }
sel4-config = { path = "../config" }
sel4-config-data = { path = "../config/data" }
