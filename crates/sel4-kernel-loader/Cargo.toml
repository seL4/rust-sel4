[package]
name = "sel4-kernel-loader"
version = "0.1.0"
authors = ["Nick Spinale <nick.spinale@coliasgroup.com>"]
edition = "2024"
license = "BSD-2-Clause AND GPL-2.0-only"

[dependencies]
embedded-hal-nb = "1.0"
fdt = "0.1.5"
log = "0.4.28"
sel4-config = { path = "../sel4/config" }
sel4-immediate-sync-once-cell = { path = "../sel4-immediate-sync-once-cell" }
sel4-immutable-cell = { path = "../sel4-immutable-cell" }
sel4-kernel-loader-payload-types = { path = "payload-types" }
sel4-logging = { path = "../sel4-logging" }
sel4-no-allocator = { path = "../sel4-no-allocator" }
sel4-phdrs = { path = "../sel4-phdrs" }
sel4-phdrs-patched = { path = "../sel4-phdrs/patched" }
sel4-platform-info = { path = "../sel4-platform-info" }
sel4-stack = { path = "../sel4-stack" }
spin = { version = "0.12.3", features = ["lock_api"] }

[build-dependencies]
cc = "1.2.43"
glob = "0.3.3"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf"] }
sel4-build-env = { path = "../sel4/build-env" }
sel4-config = { path = "../sel4/config" }

[target."cfg(any(target_arch = \"arm\", target_arch = \"aarch64\"))".dependencies]
sel4-bcm2835-aux-uart-driver = { path = "../drivers/bcm2835-aux-uart" }
sel4-pl011-driver = { path = "../drivers/pl011" }
smccc = "0.2.3"

[target."cfg(any(target_arch = \"riscv32\", target_arch = \"riscv64\"))".dependencies]
riscv = "0.16.0"
sbi = "0.3.0"

[target."cfg(target_arch = \"aarch64\")".dependencies]
aarch64-cpu = "11.1.0"

[target."cfg(target_arch = \"arm\")".dependencies]
aarch32-cpu = "0.3.0"

[lints]
cargo = { unused_dependencies = "allow" }
